name: ClarityAIKeyboard
options:
  bundleIdPrefix: com.clarityai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit
    from: "10.0.0"

targets:
  ClarityAIKeyboard:
    type: application
    platform: iOS
    sources:
      - path: ClarityAIKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarityai.keyboard
        INFOPLIST_FILE: ClarityAIKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClarityAIKeyboard/ClarityAIKeyboard.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    capabilities:
      appGroups:
        - group.com.clarityai.keyboard
    dependencies:
      - target: ClarityAIBoard
      # Embed KeyboardKit into the app bundle's Frameworks folder. The extension
      # links it via @rpath, which resolves to the containing app's Frameworks.
      - package: KeyboardKit

  ClarityAIBoard:
    type: app-extension
    platform: iOS
    sources:
      - path: ClarityAIBoard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarityai.keyboard.board
        INFOPLIST_FILE: ClarityAIBoard/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClarityAIBoard/ClarityAIBoard.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    capabilities:
      appGroups:
        - group.com.clarityai.keyboard
    dependencies:
      # Link only; the framework is embedded by the app target above.
      - package: KeyboardKit
        embed: false
